<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0b14">
<title>Kanbghik 💖</title>
<style>
  html, body { margin: 0; height: 100%; background: #0b0b14; overflow: hidden; }
  body {
    font-family: "Segoe UI", "Noto Sans", system-ui, -apple-system, sans-serif;
    color: #fff; -webkit-tap-highlight-color: transparent;
  }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; z-index: 0; }

  /* Le prénom, en haut */
  #name {
    position: fixed; left: 0; right: 0; top: calc(3vh + env(safe-area-inset-top, 0px));
    text-align: center; z-index: 2; pointer-events: none;
    font-family: "Segoe Script", "Brush Script MT", "Snell Roundhand", "Apple Chancery", cursive;
    font-size: clamp(2.1rem, 8vw, 4.4rem); line-height: 1.1; padding: 0 12px;
    background: linear-gradient(90deg, #ff9eb5, #ff4d79, #ffb3c7, #ff4d79);
    background-size: 250% 100%;
    -webkit-background-clip: text; background-clip: text; color: transparent;
    filter: drop-shadow(0 0 14px rgba(255, 77, 121, .65));
    opacity: 0; transform: translateY(-14px) scale(.96);
    transition: opacity 1.6s ease 2.6s, transform 1.6s ease 2.6s;
    animation: shine 6s linear infinite;
  }
  #name.show { opacity: 1; transform: none; }
  @keyframes shine { to { background-position: 250% 0; } }

  /* Petit message, en bas */
  #msg {
    position: fixed; left: 0; right: 0; bottom: calc(3vh + env(safe-area-inset-bottom, 0px));
    text-align: center; z-index: 2; pointer-events: none;
    font-size: clamp(.95rem, 3vw, 1.3rem); letter-spacing: .04em; color: #ffd1dc;
    text-shadow: 0 0 10px rgba(255, 77, 121, .6);
    opacity: 0; transition: opacity 1.6s ease 3.4s;
  }
  #msg.show { opacity: .9; }

  /* Écran de démarrage (nécessaire pour que la musique puisse démarrer) */
  #overlay {
    position: fixed; inset: 0; z-index: 10; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 18px; text-align: center; padding: 24px;
    background: rgba(11, 11, 20, .55); -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px);
    transition: opacity .9s ease;
  }
  #overlay.hide { opacity: 0; pointer-events: none; }
  #overlay .big { font-size: 4rem; animation: beat 1.2s infinite; }
  #overlay p { margin: 0; font-size: clamp(1.1rem, 4.5vw, 1.6rem); color: #ffd1dc; }
  #startBtn {
    font: inherit; font-size: 1.15rem; font-weight: 600; color: #fff; cursor: pointer;
    border: 0; border-radius: 999px; padding: 14px 34px;
    background: linear-gradient(135deg, #ff6b8b, #d6002f);
    box-shadow: 0 0 28px rgba(255, 77, 121, .55);
  }
  #startBtn:active { transform: scale(.96); }
  @keyframes beat { 0%, 100% { transform: scale(1); } 15% { transform: scale(1.18); } 30% { transform: scale(1); } 45% { transform: scale(1.1); } }

  /* Bouton musique */
  #muteBtn {
    position: fixed; right: calc(14px + env(safe-area-inset-right, 0px));
    bottom: calc(14px + env(safe-area-inset-bottom, 0px)); z-index: 5;
    width: 46px; height: 46px; border-radius: 50%; border: 1px solid rgba(255,255,255,.25);
    background: rgba(255,255,255,.1); color: #fff; font-size: 1.3rem; cursor: pointer;
    -webkit-backdrop-filter: blur(4px); backdrop-filter: blur(4px);
  }
  #muteBtn[hidden] { display: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<h1 id="name"></h1>
<div id="msg"></div>
<button id="muteBtn" hidden aria-label="Musique">🔊</button>

<div id="overlay">
  <div class="big">💖</div>
  <p id="intro"></p>
  <button id="startBtn">Ftah 💖</button>
</div>

<audio id="music" loop preload="auto"></audio>

<script>
/* ======================= RÉGLAGES (beddel hna) ======================= */
const CONFIG = {
  name: "RANIAA",                 // smit lbent
  message: "Kanbghik bzaf 💕",    // jomla sghira lta7t (khliha "" ila ma bghitihach)
  music: "music.mp3"              // smit fichier dyal l'ougnia (nfs dossier dyal index.html)
};
/* Astuce : tqdar t3ti smya f lien bla ma tbeddel code → .../?name=Sara */
/* ===================================================================== */

const LANGS = [
  ["Kanbghik", "Darija"], ["كنبغيك", "الدارجة"], ["أحبك", "العربية"],
  ["I love you", "English"], ["Je t’aime", "Français"], ["Te amo", "Español"],
  ["Ti amo", "Italiano"], ["Ich liebe dich", "Deutsch"], ["Eu te amo", "Português"],
  ["Ik hou van jou", "Nederlands"], ["Jag älskar dig", "Svenska"], ["Jeg elsker deg", "Norsk"],
  ["Rakastan sinua", "Suomi"], ["Kocham cię", "Polski"], ["Te iubesc", "Română"],
  ["Szeretlek", "Magyar"], ["Σ’ αγαπώ", "Ελληνικά"], ["Я тебя люблю", "Русский"],
  ["Seni seviyorum", "Türkçe"], ["אני אוהב אותך", "עברית"], ["我爱你", "中文"],
  ["愛してる", "日本語"], ["사랑해", "한국어"], ["मैं तुमसे प्यार करता हूँ", "हिन्दी"],
  ["Anh yêu em", "Tiếng Việt"], ["Saya cinta kamu", "Indonesia"], ["Mahal kita", "Tagalog"],
  ["Ngiyakuthanda", "isiZulu"], ["Ek is lief vir jou", "Afrikaans"], ["Aloha au iā ʻoe", "ʻŌlelo Hawaiʻi"]
];
const FONT = '"Segoe UI","Noto Sans","Noto Sans Arabic","Noto Sans Hebrew","Noto Sans Devanagari","Noto Sans SC","Noto Sans JP","Noto Sans KR",system-ui,sans-serif';

const params = new URLSearchParams(location.search);
const NAME = (params.get("name") || CONFIG.name).slice(0, 40);

const $ = id => document.getElementById(id);
$("name").textContent = NAME;
$("msg").textContent = CONFIG.message;
$("intro").textContent = "Chi 7aja khassa b " + NAME;
document.title = NAME + " 💖";

const cv = $("c"), ctx = cv.getContext("2d");
const rand = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
let W, H, DPR, stars = [], smalls = [];

/* ----------------------------- Fond animé ----------------------------- */
function newSmall(initial) {
  return {
    x: rand(0, W), y: initial ? rand(0, H) : H + 40,
    s: rand(.3, 1.1), v: rand(25, 70), d: rand(.6, 1.6), p: rand(0, 6.28),
    h: [340, 350, 0, 320, 280][Math.floor(Math.random() * 5)], a: rand(.25, .55), temp: false
  };
}
function initBg() {
  stars = Array.from({ length: Math.round(W * H / 9000) }, () => ({
    x: rand(0, W), y: rand(0, H), p: rand(0, 6.28), r: rand(.6, 1.8)
  }));
  const n = clamp(Math.round(W * H / 30000), 14, 34);
  smalls = Array.from({ length: n }, () => newSmall(true));
}
function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = innerWidth; H = innerHeight;
  cv.width = W * DPR; cv.height = H * DPR;
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  initBg();
}
addEventListener("resize", resize);
resize();

function heartPath(cx, cy, s, prog = 1, steps = 140) {
  ctx.beginPath();
  const n = Math.floor(steps * prog);
  for (let i = 0; i <= n; i++) {
    const t = Math.PI * 2 * i / steps;
    const x = 16 * Math.pow(Math.sin(t), 3);
    const y = 13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t);
    const px = cx + x * s, py = cy - y * s;
    i ? ctx.lineTo(px, py) : ctx.moveTo(px, py);
  }
}

function drawBackground(t, dt) {
  const g = ctx.createRadialGradient(W / 2, H / 2, 0, W / 2, H / 2, Math.max(W, H) * .7);
  g.addColorStop(0, "#1c1026"); g.addColorStop(1, "#0b0b14");
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);

  for (const s of stars) {
    const l = .25 + .75 * (.5 + .5 * Math.sin(t * 1.8 + s.p));
    ctx.fillStyle = `rgba(210,220,255,${l})`;
    ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, 6.2832); ctx.fill();
  }

  for (let i = smalls.length - 1; i >= 0; i--) {
    const p = smalls[i];
    p.y -= p.v * dt;
    if (p.y < -50) {
      if (p.temp) { smalls.splice(i, 1); continue; }
      smalls[i] = newSmall(false); continue;
    }
    const x = p.x + Math.sin(t * p.d + p.p) * 22;
    ctx.fillStyle = `hsla(${p.h},80%,58%,${p.a})`;
    heartPath(x, p.y, p.s, 1, 28);
    ctx.fill();
  }
}

/* ----------------------------- Scène principale ----------------------------- */
function fitSize(txt, weight, size, maxW) {
  ctx.font = `${weight} ${size}px ${FONT}`;
  const w = ctx.measureText(txt).width;
  return w > maxW ? Math.max(10, size * maxW / w) : size;
}
const easeOut = x => 1 - Math.pow(1 - x, 3);
const PERIOD = 2.4;

function drawScene(el) {
  const cx = W / 2, cy = H / 2 + H * .02;
  const half = Math.min(W * .24, H * .26), s = half / 16;
  const hue = 350 + 8 * Math.sin(el * .5);

  /* 1) le cœur se dessine (0 → 3 s) */
  const intro = clamp(el / 3, 0, 1);
  if (intro < 1) {
    ctx.lineWidth = 4; ctx.strokeStyle = `hsl(${hue},90%,70%)`;
    ctx.shadowColor = "#ff4d79"; ctx.shadowBlur = 18;
    heartPath(cx, cy, s, easeOut(intro)); ctx.stroke();
    ctx.shadowBlur = 0;
  }

  /* 2) le cœur se remplit puis bat */
  const fa = clamp((el - 2.4) / 1, 0, 1);
  if (fa > 0) {
    const be = Math.max(0, el - 2.6), ph = be % 1;
    const pulse = Math.exp(-Math.pow(ph - .15, 2) / .004) + .6 * Math.exp(-Math.pow(ph - .35, 2) / .004);
    const sc = s * (1 + .07 * pulse);
    const g = ctx.createRadialGradient(cx, cy - 4 * sc, 0, cx, cy - 4 * sc, 19 * sc);
    g.addColorStop(0, `hsl(${hue},95%,64%)`); g.addColorStop(1, `hsl(${hue},90%,38%)`);
    ctx.globalAlpha = fa;
    ctx.shadowColor = `hsla(${hue},100%,60%,.9)`; ctx.shadowBlur = 30 + 25 * pulse;
    ctx.fillStyle = g; heartPath(cx, cy, sc); ctx.fill();
    ctx.shadowBlur = 0;
    ctx.lineWidth = 3; ctx.strokeStyle = `hsl(${hue},80%,82%)`; ctx.stroke();
    ctx.globalAlpha = 1;
  }

  /* 3) langues qui tournent + langue au centre */
  const ra = clamp((el - 3) / 1.5, 0, 1);
  if (ra <= 0) return;
  ctx.globalAlpha = ra; ctx.textAlign = "center"; ctx.textBaseline = "middle";

  const n = LANGS.length;
  const rx = W / 2 - Math.min(80, W * .17);
  const ry = Math.max(H / 2 - Math.max(110, H * .14), H * .3);
  const base = clamp(W / 60, 13, 22), rot = el * .2;
  for (let i = 0; i < n; i++) {
    const a = rot + Math.PI * 2 * i / n;
    const depth = .5 - .5 * Math.sin(a);              // plus grand en haut
    const size = base * (.85 + .35 * depth);
    const col = `hsl(${(i / n * 360 + el * 20) % 360},70%,78%)`;
    ctx.font = `600 ${size}px ${FONT}`;
    ctx.shadowColor = col; ctx.shadowBlur = 8; ctx.fillStyle = col;
    ctx.fillText(LANGS[i][0], cx + rx * Math.cos(a), cy + ry * Math.sin(a));
  }
  ctx.shadowBlur = 0;

  const k = el >= 3 ? Math.floor((el - 3) / PERIOD) : 0;
  const p = el >= 3 ? (el - 3) % PERIOD : 0;
  const [txt, lang] = LANGS[k % n];
  const fade = Math.min(1, p / .35, (PERIOD - p) / .35);
  ctx.globalAlpha = ra * clamp(fade, 0, 1);
  const maxW = half * 1.45;
  const size = fitSize(txt, 700, clamp(half * .2, 18, 42), maxW);
  ctx.font = `700 ${size}px ${FONT}`; ctx.fillStyle = "#fff";
  ctx.fillText(txt, cx, cy - size * .1);
  const ls = clamp(half * .085, 11, 17);
  ctx.font = `italic 500 ${ls}px ${FONT}`; ctx.fillStyle = "#ffd9e2";
  ctx.fillText(lang, cx, cy + size * .75);
  ctx.globalAlpha = 1;
}

/* ----------------------------- Boucle ----------------------------- */
let started = false, t0 = 0, last = performance.now() / 1000;
function frame(now) {
  requestAnimationFrame(frame);
  const t = now / 1000, dt = Math.min(.05, t - last); last = t;
  drawBackground(t, dt);
  if (started) drawScene(t - t0);
}
requestAnimationFrame(frame);

/* ----------------------------- Démarrage + musique ----------------------------- */
const audio = $("music"), muteBtn = $("muteBtn");
let musicOk = true;
audio.addEventListener("error", () => { musicOk = false; muteBtn.hidden = true; });
audio.src = CONFIG.music;

$("startBtn").addEventListener("click", () => {
  started = true; t0 = performance.now() / 1000;
  $("overlay").classList.add("hide");
  $("name").classList.add("show");
  if (CONFIG.message) $("msg").classList.add("show");
  audio.volume = .85;
  const pr = audio.play();
  if (pr && pr.then) pr.then(() => { if (musicOk) muteBtn.hidden = false; }).catch(() => {});
});

muteBtn.addEventListener("click", () => {
  if (audio.paused) { audio.play(); muteBtn.textContent = "🔊"; }
  else { audio.pause(); muteBtn.textContent = "🔇"; }
});

/* Un clic / toucher = une petite pluie de cœurs */
addEventListener("pointerdown", e => {
  if (!started || e.target === muteBtn) return;
  for (let i = 0; i < 7; i++) {
    smalls.push({
      x: e.clientX + rand(-25, 25), y: e.clientY + rand(-10, 10),
      s: rand(.35, .9), v: rand(70, 150), d: rand(.8, 2), p: rand(0, 6.28),
      h: [340, 350, 0, 320][Math.floor(Math.random() * 4)], a: .7, temp: true
    });
  }
  if (smalls.length > 160) smalls.splice(0, smalls.length - 160);
});
</script>
</body>
</html>
